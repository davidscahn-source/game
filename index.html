<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>코스모 아케이드 · Cosmo Arcade</title>
<meta name="description" content="탭 한 번으로 즐기는 무료 미니게임 모음 — 링 러시, 별 블록, 행성 머지, 별빛 정렬, 궤도 점프">
<meta name="theme-color" content="#0b0b1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#05050f;color:#fff;
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(34px + env(safe-area-inset-top)) 18px 30px;
  background:linear-gradient(#0a0a22,#1a1040)}
h1{font-size:40px;margin:0;letter-spacing:-1px;background:linear-gradient(120deg,#7df9ff,#b48cff 55%,#ff8ad1);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin:6px 0 14px;opacity:.75;font-size:15px}
.streak{display:inline-block;margin:0 0 16px;padding:7px 14px;border-radius:999px;background:rgba(255,178,62,.16);color:#ffcf7a;font-size:14px;font-weight:700}
.card{display:flex;align-items:center;gap:16px;padding:16px;margin-bottom:12px;border-radius:20px;text-decoration:none;color:#fff;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13)}
.card:active{transform:scale(.98)}
.ico{flex:none;width:68px;height:68px;border-radius:18px;display:grid;place-items:center;font-size:34px}
.card b{display:block;font-size:20px}
.card span{display:block;font-size:13.5px;opacity:.7;margin-top:2px}
.card em{font-style:normal;font-size:12.5px;color:#ffe066;margin-top:5px;display:block;min-height:15px}
.go{margin-left:auto;font-size:22px;opacity:.5}
footer{text-align:center;margin-top:22px;font-size:12px}
footer{color:rgba(255,255,255,.45)}
footer a{color:#fff;opacity:.45}
footer button{background:none;border:0;color:#7df9ff;font:inherit;text-decoration:underline;cursor:pointer;padding:6px}
</style>
</head>
<body>
<main>
  <h1 data-ko="코스모 아케이드" data-en="Cosmo Arcade"></h1>
  <p class="tag" data-ko="짧게, 한 판만 더! 무료 미니게임 모음" data-en="Quick free mini-games. Just one more round!"></p>
  <p class="streak" id="streak" hidden></p>

  <a class="card" href="rush/index.html">
    <div class="ico" style="background:linear-gradient(135deg,#ff4f7b,#7a2cff)">⚡</div>
    <div><b data-ko="링 러시" data-en="Ring Rush"></b><span data-ko="고난도! 궤도를 바꿔 피하는 반사신경 게임" data-en="Hard mode: switch rings, dodge fast"></span><em data-best="cosmo.rush"></em></div>
    <div class="go">›</div>
  </a>
  <a class="card" href="blocks/index.html">
    <div class="ico" style="background:linear-gradient(135deg,#ffb23e,#ff6f61)">🧩</div>
    <div><b data-ko="별 블록" data-en="Star Blocks"></b><span data-ko="조각을 놓아 줄을 지우는 퍼즐" data-en="Place pieces, clear lines"></span><em data-best="cosmo.blocks"></em></div>
    <div class="go">›</div>
  </a>
  <a class="card" href="merge/index.html">
    <div class="ico" style="background:linear-gradient(135deg,#5b8cff,#b06cff)">🪐</div>
    <div><b data-ko="행성 머지" data-en="Planet Merge"></b><span data-ko="같은 행성을 합쳐 더 크게" data-en="Merge planets into bigger ones"></span><em data-best="cosmo.merge"></em></div>
    <div class="go">›</div>
  </a>
  <a class="card" href="sort/index.html">
    <div class="ico" style="background:linear-gradient(135deg,#2bd4a4,#1c8fd6)">🧪</div>
    <div><b data-ko="별빛 정렬" data-en="Star Sort"></b><span data-ko="같은 색끼리 모으는 레벨 퍼즐" data-en="Sort colors, level by level"></span><em data-level="cosmo.sort"></em></div>
    <div class="go">›</div>
  </a>
  <a class="card" href="orbit/index.html">
    <div class="ico" style="background:linear-gradient(135deg,#7a6cff,#ff8ad1)">🚀</div>
    <div><b data-ko="궤도 점프" data-en="Orbit Leap"></b><span data-ko="탭 한 번으로 행성 사이를 점프" data-en="One-tap leaps between planets"></span><em data-best="orbitleap.v1"></em></div>
    <div class="go">›</div>
  </a>

  <footer><button id="lang"></button> · <a href="privacy.html" data-ko="개인정보처리방침" data-en="Privacy Policy"></a><span id="privacyOptionsSep" hidden> · </span><button id="privacyOptions" data-ko="광고 개인정보 설정" data-en="Ad privacy settings" hidden></button><p id="privacyOptionsStatus" role="status" hidden></p></footer>
</main>
<script src="config.js"></script>
<script src="ads.js"></script>
<script>
(function () {
  var pref = null;
  try { pref = new URLSearchParams(location.search).get('lang') || localStorage.getItem('cosmo.lang'); } catch (e) {}
  if (pref) { try { localStorage.setItem('cosmo.lang', pref === 'ko' ? 'ko' : 'en'); } catch (e) {} }
  var ko = pref ? pref === 'ko' : (navigator.language || 'ko').toLowerCase().indexOf('ko') === 0;
  var lg = document.getElementById('lang');
  lg.textContent = ko ? 'English' : '한국어';
  lg.onclick = function () { try { localStorage.setItem('cosmo.lang', ko ? 'en' : 'ko'); } catch (e) {} location.href = location.pathname; };
  document.documentElement.lang = ko ? 'ko' : 'en';
  document.querySelectorAll('[data-ko]').forEach(function (el) { el.textContent = el.getAttribute(ko ? 'data-ko' : 'data-en'); });
  function read(key) { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch (e) { return {}; } }
  document.querySelectorAll('[data-best]').forEach(function (el) {
    var b = read(el.getAttribute('data-best')).best;
    if (b) el.textContent = (ko ? '최고 ' : 'Best ') + b;
  });
  // 연속 접속 일수 (끊겨도 불이익 없이 1일부터 다시 시작)
  try {
    var c = read('cosmo.common'), d = new Date(), t = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
    d.setDate(d.getDate() - 1);
    var y = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
    if (c.day !== t) { c.streak = c.day === y ? (c.streak || 0) + 1 : 1; c.day = t; localStorage.setItem('cosmo.common', JSON.stringify(c)); }
    var el = document.getElementById('streak');
    el.textContent = '🔥 ' + (ko ? c.streak + '일 연속 접속 · 오늘의 도전이 새로 열렸어요' : 'Day ' + c.streak + ' streak · new daily challenges are open');
    el.hidden = false;
  } catch (e) {}
  document.querySelectorAll('[data-level]').forEach(function (el) {
    var l = read(el.getAttribute('data-level')).level;
    if (l > 1) el.textContent = (ko ? '레벨 ' : 'Level ') + l;
  });
  var native = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
  if (native) {
    var privacyOptions = document.getElementById('privacyOptions');
    var privacySep = document.getElementById('privacyOptionsSep');
    var privacyStatus = document.getElementById('privacyOptionsStatus');
    Ads.hooks.onPrivacyOptionsChanged = function (required) { privacyOptions.hidden = !required; privacySep.hidden = !required; };
    privacyOptions.onclick = async function () {
      privacyOptions.disabled = true; privacyStatus.hidden = true;
      var ok = await Ads.showPrivacyOptions();
      if (!ok) { privacyStatus.textContent = ko ? '설정을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.' : 'Unable to load settings. Please try again.'; privacyStatus.hidden = false; }
      privacyOptions.disabled = false;
    };
    Ads.init({ preload: false });
  }
  if (!native && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
